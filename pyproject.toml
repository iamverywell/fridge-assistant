[project]
name = "fridge-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.25",
    "openai-whisper>=20250625",
    "pydantic-settings>=2.0",
    "scipy>=1.17.1",
    "sounddevice>=0.5.5",
    "streamlit>=1.57.0",
]

[project.scripts]
fridge-assistant = "fridge_assistant.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fridge_assistant"]
